\":1,\"text\":\"覚めたことはあるのです\"},{\"id\":2,\"text\":\"覚めないことはないのです\"},{\"id\":3,\"text\":\"覚めたことは覚めたのです\"},{\"id\":4,\"text\":\"覚めたことはないのです\"}]},{\"number\":7,\"question\":\"彼の職場は（　　）女性とは縁がない。\",\"options\":[{\"id\":1,\"text\":\"まったく\"},{\"id\":2,\"text\":\"めったに\"},{\"id\":3,\"text\":\"決して\"},{\"id\":4,\"text\":\"はじめて\"}]},{\"number\":8,\"question\":\"あなたがいくら許してやれといっても、彼を（　　）。\",\"options\":[{\"id\":1,\"text\":\"許すわけだ\"},{\"id\":2,\"text\":\"許すわけにはいかない\"},{\"id\":3,\"text\":\"許さないわけにはいかない\"},{\"id\":4,\"text\":\"許さないわけがない\"}]},{\"number\":9,\"question\":\"両親が（　　）うちに、旅行に連れていきたい。\",\"options\":[{\"id\":1,\"text\":\"元気\"},{\"id\":2,\"text\":\"元気だ\"},{\"id\":3,\"text\":\"元気に\"},{\"id\":4,\"text\":\"元気な\"}]},{\"number\":10,\"question\":\"これは古いから、もし（　　）またすぐ壊れると思いますよ。\",\"options\":[{\"id\":1,\"text\":\"修理したら\"},{\"id\":2,\"text\":\"修理すれば\"},{\"id\":3,\"text\":\"修理したとしても\"},{\"id\":4,\"text\":\"修理するなら\"}]},{\"number\":11,\"question\":\"目の悪い彼女にあんな遠くの小さい文字が（　　）。\",\"options\":[{\"id\":1,\"text\":\"見えないわけがない\"},{\"id\":2,\"text\":\"見えるわけにはいかない\"},{\"id\":3,\"text\":\"見えることは見える\"},{\"id\":4,\"text\":\"見えるわけがない\"}]},{\"number\":12,\"question\":\"旅行会社に聞いて（　　）ところ、安い切符が買えた。\",\"options\":[{\"id\":1,\"text\":\"みる\"},{\"id\":2,\"text\":\"みた\"},{\"id\":3,\"text\":\"みない\"},{\"id\":4,\"text\":\"みなかった\"}]},{\"number\":13,\"question\":\"寒い（　　）。窓が少し開いているよ。\",\"options\":[{\"id\":1,\"text\":\"わけではない\"},{\"id\":2,\"text\":\"わけがない\"},{\"id\":3,\"text\":\"わけだ\"},{\"id\":4,\"text\":\"わけにはいかない\"}]},{\"number\":14,\"question\":\"眠い。（　　）10分寝かせて。\",\"options\":[{\"id\":1,\"text\":\"あと\"},{\"id\":2,\"text\":\"それと\"},{\"id\":3,\"text\":\"もっと\"},{\"id\":4,\"text\":\"その上\"}]},{\"number\":15,\"question\":\"どんなことがあっても、（　　）この箱を開けてはいけません。\",\"options\":[{\"id\":1,\"text\":\"まったく\"},{\"id\":2,\"text\":\"決して\"},{\"id\":3,\"text\":\"めったに\"},{\"id\":4,\"text\":\"少しも\"}]}]},{\"problem_number\":2,\"title\":\"問題2 つぎの文の＿＿★＿＿に入る最もよいものを、1・2・3・4から一つえらびなさい。\",\"instruction_id\":\"Pilih kata yang paling tepat untuk mengisi posisi ★ dari pilihan 1・2・3・4. (Soal penyusunan kalimat — tentukan kata yang berada di posisi bintang.)\",\"instruction_en\":\"Choose the best word for the ★ position from options 1・2・3・4. (Sentence arrangement — find the word in the star position.)\",\"questions\":[{\"number\":16,\"question\":\"コーヒーは先に ＿＿ ＿＿ ★ ＿＿ なさいますか。\",\"options\":[{\"id\":1,\"text\":\"しましょうか\"},{\"id\":2,\"text\":\"お持ち\"},{\"id\":3,\"text\":\"あとに\"},{\"id\":4,\"text\":\"それとも\"}]},{\"number\":17,\"question\":\"私は入社試験に全部落ちて ＿＿ ＿＿ ★ ＿＿ なった。\",\"options\":[{\"id\":1,\"text\":\"つぐ\"},{\"id\":2,\"text\":\"父の\"},{\"id\":3,\"text\":\"ことに\"},{\"id\":4,\"text\":\"店を\"}]},{\"number\":18,\"question\":\" ＿＿ ＿＿ ★ ＿＿ はじめて発音が悪いことを知った。\",\"options\":[{\"id\":1,\"text\":\"聞いて\"},{\"id\":2,\"text\":\"自分の\"},{\"id\":3,\"text\":\"日本語を\"},{\"id\":4,\"text\":\"録音した\"}]},{\"number\":19,\"question\":\" ＿＿ ＿＿ ★ ＿＿ ぜひ遊びに来てください。\",\"options\":[{\"id\":1,\"text\":\"いる\"},{\"id\":2,\"text\":\"日本に\"},{\"id\":3,\"text\":\"僕が\"},{\"id\":4,\"text\":\"うちに\"}]},{\"number\":20,\"question\":\" ＿＿ ＿＿ ★ ＿＿ まだよく理解していません。\",\"options\":[{\"id\":1,\"text\":\"復習した\"},{\"id\":2,\"text\":\"ことは\"},{\"id\":3,\"text\":\"が\"},{\"id\":4,\"text\":\"しました\"}]}]},{\"problem_number\":3,\"title\":\"問題3 つぎの文章を読んで、21から25の中に入る最もよいものを、1・2・3・4から一つえらびなさい。\",\"instruction_id\":\"Bacalah teks berikut, lalu pilih jawaban yang paling tepat untuk mengisi nomor 21 sampai 25 dari pilihan 1・2・3・4.\",\"instruction_en\":\"Read the following passage, then choose the best option from 1・2・3・4 to fill in numbers 21 to 25.\",\"passage\":{\"text\":\"信号を守っていたのに車にひかれたことがある。それ以来、私は[21]車も信号も信用しない[22]。\\n\\n信号が青に[23]うちに「もう行ける」と動き出す車。もう黄色から赤になっているのに「まだ行ける」と無理をする車。[24]1分とか30秒がどうして待てないのだろう。そんなに忙しい人たちなのだろうか。\\n\\n私には[25]理解ができない。\",\"translation_id\":\"Saya pernah ditabrak mobil padahal saya menaati lampu lalu lintas. Sejak itu, saya [21] tidak percaya pada mobil maupun lampu lalu lintas [22].\\n\\nMobil yang sebelum lampu [23] hijau sudah mulai bergerak sambil berkata 'sudah bisa jalan'. Mobil yang nekat berkata 'masih bisa' padahal lampu sudah berubah dari kuning ke merah. [24] Kenapa mereka tidak bisa menunggu satu menit atau 30 detik? Apakah mereka orang-orang yang sangat sibuk?\\n\\nBagi saya, [25] tidak bisa dimengerti.\"},\"questions\":[{\"number\":21,\"question\":\"[21] に入るもの\",\"options\":[{\"id\":1,\"text\":\"決して\"},{\"id\":2,\"text\":\"たとえ\"},{\"id\":3,\"text\":\"もしかすると\"},{\"id\":4,\"text\":\"もしも\"}]},{\"number\":22,\"question\":\"[22] に入るもの\",\"options\":[{\"id\":1,\"text\":\"わけにはいかない\"},{\"id\":2,\"text\":\"ことになっている\"},{\"id\":3,\"text\":\"わけがない\"},{\"id\":4,\"text\":\"ことにしている\"}]},{\"number\":23,\"question\":\"[23] に入るもの\",\"options\":[{\"id\":1,\"text\":\"変わる\"},{\"id\":2,\"text\":\"変わった\"},{\"id\":3,\"text\":\"変わらない\"},{\"id\":4,\"text\":\"変わらなかった\"}]},{\"number\":24,\"question\":\"[24] に入るもの\",\"options\":[{\"id\":1,\"text\":\"その上\"},{\"id\":2,\"text\":\"それとも\"},{\"id\":3,\"text\":\"少しも\"},{\"id\":4,\"text\":\"あと\"}]},{\"number\":25,\"question\":\"[25] に入るもの\",\"options\":[{\"id\":1,\"text\":\"たとえ\"},{\"id\":2,\"text\":\"まったく\"},{\"id\":3,\"text\":\"もしかすると\"},{\"id\":4,\"text\":\"もしも\"}]}]}],\"keigo_supplement\":{\"title\":\"敬語 (Keigo) — おねがい\",\"subtitle\":\"いただく・Vていただく・Vさせていただく\",\"description_box\":{\"explanation\":\"Bagian bonus untuk mempelajari ungkapan PERMINTAAN SOPAN (お願い) menggunakan bentuk keigo. Tiga pola dasar:\\n\\n1. **〜をいただけませんか** — Meminta BENDA. Pembicara menerima dari lawan bicara.\\n   📌 (=私がもらう)\\n\\n2. **〜ていただけませんか** — Meminta TINDAKAN. Lawan bicara melakukan sesuatu untuk pembicara.\\n   📌 (=あなたが私に〜する)\\n\\n3. **〜させていただけませんか** — Meminta IZIN. Pembicara meminta izin melakukan sesuatu sendiri.\\n   📌 (=私が〜する)\",\"explanation_en\":\"Bonus section for learning POLITE REQUESTS (お願い) using keigo forms. Three basic patterns:\\n\\n1. **〜をいただけませんか** — Requesting an OBJECT. Speaker receives from listener.\\n\\n2. **〜ていただけませんか** — Requesting an ACTION. Listener does something for speaker.\\n\\n3. **〜させていただけませんか** — Requesting PERMISSION. Speaker asks permission to do something themselves.\"},\"key_question\":\"だれがVする？ (Siapa yang melakukan?)\",\"examples\":[{\"jp\":\"カタログをいただけませんか。\",\"en\":\"Katarogu o itadakemasen ka. — 'Bolehkah saya mendapatkan katalognya?'\",\"explanation\":\"← 私がもらう (Saya yang menerima/mengambil katalog)\"},{\"jp\":\"道を教えていただけませんか。\",\"en\":\"Michi o oshiete itadakemasen ka. — 'Bolehkah Anda menunjukkan jalan kepada saya?'\",\"explanation\":\"← あなたが私に教える (Anda yang menunjukkan jalan kepada saya)\"},{\"jp\":\"明日は休ませていただけませんか。\",\"en\":\"Ashita wa yasumasete itadakemasen ka. — 'Bolehkah saya minta izin libur besok?'\",\"explanation\":\"← 私が休む (Saya yang ingin libur — minta izin)\"}],\"practice\":{\"instruction\":\"【問い】下線部を敬語に直しなさい。 (Ubah bagian yang digarisbawahi menjadi bentuk keigo.)\",\"questions\":[{\"number\":1,\"question\":\"この写真をもらいたい。\",\"underlined\":\"もらいたい\",\"hint\":\"Pembicara ingin menerima foto → gunakan pola いただく\"},{\"number\":2,\"question\":\"私の写真を撮ってほしい。\",\"underlined\":\"撮ってほしい\",\"hint\":\"Pembicara ingin lawan bicara melakukan tindakan (memotret) → gunakan pola Vていただく\"},{\"number\":3,\"question\":\"あなたの写真を撮りたい。\",\"underlined\":\"撮りたい\",\"hint\":\"Pembicara ingin meminta izin untuk memotret → gunakan pola Vさせていただく\"}]}},\"summary_table\":{\"title\":\"💡 Ringkasan Pola Minggu ke-6\",\"rows\":[{\"pattern\":\"〜ことにする／している\",\"meaning\":\"Memutuskan~ / Membiasakan~\",\"usage\":\"Keputusan pribadi\"},{\"pattern\":\"〜ことになる／なっている\",\"meaning\":\"Diputuskan~ / Sudah menjadi aturan~\",\"usage\":\"Keputusan eksternal/aturan\"},{\"pattern\":\"〜わけだ／わけではない／わけがない／わけにはいかない\",\"meaning\":\"Pantas saja / Bukannya / Mustahil / Tidak boleh\",\"usage\":\"Empat pola わけ (lihat Hari 4)\"},{\"pattern\":\"決して／まったく／めったに／少しも〜ない\",\"meaning\":\"Penegasan negasi (Hari 5)\",\"usage\":\"Berbagai tingkat negasi\"},{\"pattern\":\"それと／あと／それとも／その上\",\"meaning\":\"Penghubung (Hari 6)\",\"usage\":\"Menambah info atau pilihan\"}]}}}],\"$L13\"]}]}]]}]\n"])</script>
